name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Build macOS binaries
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --target=bun-darwin-arm64 --outfile=./dist/slack-notifier-darwin-arm64
          bun build ./src/index.ts --compile --target=bun-darwin-x64 --outfile=./dist/slack-notifier-darwin-x64
          (cd dist && shasum -a 256 slack-notifier-darwin-* > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/slack-notifier-darwin-* dist/checksums.txt --generate-notes
