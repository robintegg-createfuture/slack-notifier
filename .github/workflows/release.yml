name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify and package
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Smoke test and checksum package
        run: |
          java -jar target/slack-notifier.jar --help
          (cd target && sha256sum slack-notifier.jar > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/slack-notifier.jar target/checksums.txt --generate-notes
